<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="NossaCarta mark">
  <defs>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C796"/>
      <stop offset="55%" stop-color="#D4AF7A"/>
      <stop offset="100%" stop-color="#A8854F"/>
    </linearGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" in="SourceAlpha"/>
      <feOffset dx="0" dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- envelope body -->
  <rect x="20" y="48" width="160" height="96" rx="4" fill="#FAF6F0" stroke="#7B1E3A" stroke-width="3"/>

  <!-- back flap creases -->
  <path d="M20 144 L100 96 L180 144" fill="none" stroke="#7B1E3A" stroke-width="2" opacity="0.55"/>
  <path d="M20 48 L100 100 L180 48" fill="none" stroke="#7B1E3A" stroke-width="2" opacity="0.4"/>

  <!-- top closed flap -->
  <path d="M20 48 L100 110 L180 48 Z" fill="#FAF6F0" stroke="#7B1E3A" stroke-width="3" stroke-linejoin="round"/>

  <!-- wax seal -->
  <g filter="url(#waxShadow)">
    <circle cx="100" cy="100" r="22" fill="url(#wax)" stroke="#7B1E3A" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="17" fill="none" stroke="#7B1E3A" stroke-width="0.8" opacity="0.55"/>
    <text x="100" y="106" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="18" fill="#2B1810" letter-spacing="0.5">NC</text>
  </g>
</svg>
